<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Imbuhan: Terapung (Berbilang Tahap)</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: #87CEEB; /* Sky blue */
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-area {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
            border: 5px solid #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .level-indicator {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.7);
            padding: 5px 15px;
            border-radius: 10px;
            z-index: 5;
        }

        .instruction-text {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #1565C0;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            z-index: 5;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* The floating prefix */
        .floating-prefix {
            position: absolute;
            top: 40%;
            left: 15%;
            background-color: #FF9800;
            color: white;
            font-size: 4em;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            animation: floatSlowly 4s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes floatSlowly {
            0% { transform: translate(0, 0) rotate(-5deg); }
            100% { transform: translate(60px, -40px) rotate(5deg); }
        }

        /* The root words on the side */
        .words-container {
            position: absolute;
            right: 8%;
            top: 25%; /* Pushed down to avoid overlapping the instruction text */
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 250px;
        }

        .root-word {
            background-color: white;
            color: #333;
            font-size: 2.2em;
            font-weight: bold;
            padding: 15px 10px;
            border: 4px solid #4CAF50;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            width: 100%;
            text-align: center;
        }

        .root-word:hover {
            transform: scale(1.05);
            background-color: #e8f5e9;
        }

        /* Feedback classes applied via JS */
        .correct {
            background-color: #4CAF50 !important;
            color: white !important;
            border-color: #2E7D32 !important;
            animation: bounce 0.5s;
        }

        .incorrect {
            background-color: #F44336 !important;
            color: white !important;
            border-color: #B71C1C !important;
            opacity: 0.6;
            pointer-events: none;
        }

        .grayed-out {
            background-color: #e0e0e0 !important;
            color: #9e9e9e !important;
            border-color: #bdbdbd !important;
            opacity: 0.5;
            pointer-events: none;
            box-shadow: none;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* Bottom instruction/feedback text */
        .feedback-message {
            position: absolute;
            bottom: 80px;
            width: 100%;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            transition: color 0.3s;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Big victory text */
        .combined-word-display {
            position: absolute;
            top: 45%;
            left: 40%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            text-align: center;
            font-size: 4.5em;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.6);
            display: none;
            z-index: 40;
        }
        
        .action-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: 1.2em;
            font-weight: bold;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
            z-index: 30;
        }
        
        .action-btn:hover {
            background: #0056b3;
        }
        
        /* Celebration overlay for end of game */
        .end-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .end-screen h1 {
            font-size: 4em;
            color: #FF9800;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .game-area {
                width: 100%;
                height: 100vh;
                max-height: none;
                border: none;
                border-radius: 0;
            }
            
            .instruction-text {
                font-size: 1.3em;
                top: 60px;
                padding: 0 10px;
            }
            
            .floating-prefix {
                font-size: 2.5em;
                padding: 15px 30px;
                left: 5%;
                top: 25%;
            }
            
            .words-container {
                width: 55%;
                right: 5%;
                top: 40%;
                gap: 15px;
            }
            
            .root-word {
                font-size: 1.5em;
                padding: 12px 5px;
            }
            
            .feedback-message {
                font-size: 1.2em;
                bottom: 80px;
                padding: 0 10px;
            }
            
            .combined-word-display {
                font-size: 3em;
                left: 50%;
                top: 30%;
            }
            
            .action-btn {
                width: 80%;
                font-size: 1.2em;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="game-area" id="game-area">
        <div class="level-indicator" id="level-indicator">Tahap 1 / 7</div>
        <div class="instruction-text" id="instruction-text"></div>
        
        <div class="combined-word-display" id="result-word"></div>

        <div class="floating-prefix" id="prefix"></div>

        <div class="words-container" id="words-container">
            <!-- Buttons will be injected here by JS -->
        </div>

        <div class="feedback-message" id="feedback-msg"></div>
        
        <button class="action-btn" id="next-btn" onclick="nextLevel()">Seterusnya ➡️</button>
        
        <div class="end-screen" id="end-screen">
            <h1>Tahniah! 🎉</h1>
            <p style="font-size: 1.5em; color: #333; margin-bottom: 30px;">Anda telah menguasai semua imbuhan!</p>
            <button class="action-btn" style="display: block; position: static;" onclick="location.reload()">Main Semula 🔄</button>
        </div>
    </div>

    <script>
        let levelsData = {};
        let availablePrefixes = [];
        let currentRound = 1;
        let gameActive = true;
        let currentPrefix = "";

        // Fetch data from JSON file
        async function loadData() {
            try {
                const response = await fetch('imbuhan_data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                levelsData = await response.json();
                availablePrefixes = Object.keys(levelsData);
                loadLevel();
            } catch (error) {
                console.error('Error loading JSON:', error);
                document.getElementById('feedback-msg').textContent = "Ralat: Tidak dapat membaca fail JSON. Sila gunakan 'Run_Game_Server.bat'.";
                document.getElementById('feedback-msg').style.color = "red";
            }
        }

        // Utility to shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Utility to pick a random item from array
        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function loadLevel() {
            if (availablePrefixes.length === 0) return;
            gameActive = true;
            
            // Update UI
            document.getElementById('level-indicator').textContent = `Pusingan ${currentRound}`;
            
            // 1. Pick a random Prefix
            currentPrefix = getRandomItem(availablePrefixes);
            
            const prefixEl = document.getElementById('prefix');
            prefixEl.textContent = currentPrefix;
            
            // Reset styles for animation
            prefixEl.style.display = 'block';
            prefixEl.style.animation = 'floatSlowly 4s ease-in-out infinite alternate';
            prefixEl.style.transition = 'none';
            prefixEl.style.left = '15%';
            prefixEl.style.top = '40%';
            
            document.getElementById('result-word').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            
            const instructionMsg = document.getElementById('instruction-text');
            instructionMsg.innerHTML = `Pilih perkataan yang betul untuk imbuhan "<strong>${currentPrefix}</strong>"`;
            instructionMsg.style.display = 'block';

            const feedbackMsg = document.getElementById('feedback-msg');
            feedbackMsg.textContent = "";
            
            // 2. Pick the correct word from the selected prefix
            const correctData = getRandomItem(levelsData[currentPrefix]);

            // 3. Pick 2 wrong words from DIFFERENT prefixes
            let otherPrefixes = availablePrefixes.filter(p => p !== currentPrefix);
            otherPrefixes = shuffleArray(otherPrefixes);
            
            let wrongChoices = [];
            for(let i=0; i<2; i++) {
                let wrongPrefix = otherPrefixes[i];
                let wrongData = getRandomItem(levelsData[wrongPrefix]);
                
                wrongChoices.push({
                    text: wrongData.word,
                    isCorrect: false,
                    reason: `Salah! '${wrongData.word}' lebih sesuai menggunakan '${wrongPrefix}' (${wrongData.combined})`,
                    data: null
                });
            }

            // 4. Combine and shuffle choices
            let choices = [
                { text: correctData.word, isCorrect: true, data: correctData },
                ...wrongChoices
            ];
            choices = shuffleArray(choices);

            // Render buttons
            const container = document.getElementById('words-container');
            container.innerHTML = ''; 
            
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'root-word';
                btn.textContent = choice.text;
                btn.onclick = () => checkAnswer(choice, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(choice, btn) {
            if (!gameActive) return;

            const buttons = document.querySelectorAll('.root-word');
            const feedbackMsg = document.getElementById('feedback-msg');
            const resultWord = document.getElementById('result-word');
            const prefixEl = document.getElementById('prefix');
            const nextBtn = document.getElementById('next-btn');

            if (choice.isCorrect) {
                // Correct logic
                btn.classList.add('correct');
                
                // Stop floating animation
                prefixEl.style.animation = 'none'; 
                prefixEl.style.transition = 'all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1)';
                
                // Fly prefix to button
                prefixEl.style.left = (btn.offsetLeft - prefixEl.offsetWidth + 10) + 'px';
                prefixEl.style.top = btn.offsetTop + 'px';

                // Mark others gray
                buttons.forEach(b => {
                    if (b !== btn) b.classList.add('grayed-out');
                });

                feedbackMsg.textContent = "Tahniah! Tepat sekali!";
                feedbackMsg.style.color = "#2E7D32";

                // Merge into combined word
                setTimeout(() => {
                    prefixEl.style.display = 'none';
                    btn.style.display = 'none';
                    document.getElementById('instruction-text').style.display = 'none';
                    
                    resultWord.textContent = `✨ ${choice.data.combined} ✨`;
                    resultWord.style.display = 'block';
                    
                    feedbackMsg.textContent = `${currentPrefix} + ${choice.text} = ${choice.data.combined.toLowerCase()}`;
                    
                    nextBtn.style.display = 'block';
                }, 700);

                gameActive = false;

            } else {
                // Incorrect logic
                btn.classList.add('incorrect');
                feedbackMsg.innerHTML = choice.reason + "<br><strong>Cuba lagi! 💪</strong>";
                feedbackMsg.style.color = "#D32F2F";
            }
        }
        
        function nextLevel() {
            currentRound++;
            loadLevel(); // Endless mode!
        }

        // Initialize first level by loading data
        window.onload = loadData;
    </script>
</body>
</html>
